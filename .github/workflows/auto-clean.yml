name: 自动清理 Actions 记录
on:
  schedule:
    - cron: '0 1 * * *'  # 北京时间每天 9:00 执行
  workflow_dispatch:     # 支持手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 删除旧的工作流记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          keep_minimum_runs: 5          # 只保留最近 5 条记录
          retain_only_successful: true  # 只保留成功的记录
          delete_failed_runs: true       # 删除失败/取消的记录
