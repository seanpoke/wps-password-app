name: 自动清理 Actions 记录
on:
  schedule:
    - cron: '0 1 * * *'  # 北京时间每天 9:00 执行
  workflow_dispatch:     # 支持手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: 使用官方推荐的清理 Action
        uses: tokio-rs/delete-workflow-runs@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep-minimum-runs: 5          # 保留最近 5 条记录
          retain-only-successful: true  # 只保留成功的记录
          delete-failed-runs: true       # 删除失败/取消的记录
