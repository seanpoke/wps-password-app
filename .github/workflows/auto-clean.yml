name: 自动清理 Actions 记录
on:
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间 9:00
  workflow_dispatch:     # 手动触发

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: 安装依赖
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 差异化清理：当前清理脚本保留2条，其他保留5条
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # 固定的当前配置文件名
          CURRENT_FILE: "auto-clean.yml"
        run: |
          set -e

          # ==============================================
          # 规则：
          # 1. 所有工作流的 失败/取消 记录全部删除
          # 2. auto-clean.yml 自身：成功记录只保留最新 2 条
          # 3. 其他所有业务工作流：成功记录依然保留最新 5 条
          # ==============================================

          echo "===== 开始清理所有工作流 ====="

          # 1. 删除所有失败/取消的记录
          echo "【1/2】删除所有失败、取消的记录"
          gh api "/repos/$REPO/actions/runs?per_page=100" | \
            jq -r '.workflow_runs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id' | \
            xargs -I{} sh -c 'echo "🗑️ 删除记录: {}" && gh api -X DELETE "/repos/$REPO/actions/runs/{}"'

          # 2. 遍历所有工作流，根据配置文件名差异化保留
          echo -e "\n【2/2】开始差异化保留成功记录"
          
          # 获取所有工作流的 id, name 和 path(形如 .github/workflows/abc.yml)，用 tab 分隔
          gh api "/repos/$REPO/actions/workflows" | jq -r '.workflows[] | "\(.id)\t\(.name)\t\(.path)"' | \
            while IFS=$'\t' read -r WF_ID WF_NAME WF_PATH; do
              
              # 提取路径中的文件名 (例如从 .github/workflows/auto-clean.yml 提取出 auto-clean.yml)
              WF_FILE=$(basename "$WF_PATH")

              # 通过文件名精确判断是否是当前的清理脚本
              if [ "$WF_FILE" = "$CURRENT_FILE" ]; then
                KEEP_NUM=2
                echo -e "\n🧹 发现清理脚本自身 [$WF_NAME] ($WF_FILE), 将仅保留最新 $KEEP_NUM 条成功记录"
              else
                KEEP_NUM=5
                echo -e "\n📦 发现业务脚本 [$WF_NAME] ($WF_FILE), 将保留最新 $KEEP_NUM 条成功记录"
              fi

              # 根据动态计算的 KEEP_NUM 进行清理
              gh api "/repos/$REPO/actions/runs?workflow_id=$WF_ID&status=success&per_page=100" | \
                jq -r --argjson keep "$KEEP_NUM" '.workflow_runs | sort_by(.created_at) | reverse | .[$keep:] | .[].id' | \
                xargs -I{} sh -c 'echo "🗑️ 删除旧成功记录: {}" && gh api -X DELETE "/repos/$REPO/actions/runs/{}"'
                
            done

          echo -e "\n✅ 全部清理完成！"
