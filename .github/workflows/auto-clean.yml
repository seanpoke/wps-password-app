name: 自动清理 Actions 记录
on:
  schedule:
    - cron: '0 1 * * *'  # 每天北京时间 9:00 自动执行
  workflow_dispatch:     # 支持手动触发清理

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: 清理旧记录，仅保留最近5条成功运行
        uses: actions/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          keep_minimum_runs: 5
          retain_only_successful: true
          delete_failed_runs: true
