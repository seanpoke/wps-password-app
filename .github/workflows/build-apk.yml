name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        lfs: false

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip
        unzip -q gradle-8.2-bin.zip -d /opt/gradle
        echo "GRADLE_HOME=/opt/gradle/gradle-8.2" >> $GITHUB_ENV
        echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

    - name: Build debug APK
      run: gradle assembleDebug

    - name: List built APK files
      run: |
        ls -la app/build/outputs/apk/debug/

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: 文档密码管理-debug
        path: app/build/outputs/apk/debug/*.apk