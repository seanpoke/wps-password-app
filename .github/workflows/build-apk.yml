name: Build APK

on:
  # 主分支 push 自动构建（产物为 zip artifact）
  # 推送 v* 标签（如 v1.0.5）时额外创建 GitHub Release，附件为可直接下载的 apk 文件
  push:
    branches: [ main ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 关键步骤：使用官方 Action 统一安装和配置纯净、兼容的 Gradle 8.7，直接绕过本地 gradlew
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 解密证书
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${{ github.workspace }}/release.jks"

      # 执行打包（直接调用刚才装好的 gradle 命令，版本完美兼容 AGP 8.x）
      - name: Build release APK
        run: gradle assembleRelease
        env:
          TZ: Asia/Shanghai
          KEYSTORE_FILE: "${{ github.workspace }}/release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: List built APK files
        run: |
          ls -la app/build/outputs/apk/release/

      # 取构建产物 APK 的文件名（已含 版本号+时间戳，如 文档密码管理_1.0.5_20261008100412）作为 artifact 名
      - name: Resolve APK name
        run: |
          APK_PATH=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          APK_NAME=$(basename "$APK_PATH" .apk)
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "Artifact name: $APK_NAME"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_NAME }}
          path: app/build/outputs/apk/release/*.apk

      # 打 v* 标签时：把原始 apk 文件挂到 GitHub Release（非zip，可直接下载安装）
      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
