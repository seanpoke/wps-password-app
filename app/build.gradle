plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def buildDate = new Date().format('yyyyMMddHHmm')

android {
    namespace 'com.wpspasswordmanager'
    compileSdk 34

    defaultConfig {
        applicationId "com.wpspasswordmanager"
        minSdk 26
        targetSdk 34
        versionCode 100
        versionName "1.0.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            def ksFile = System.getenv('KEYSTORE_FILE') ?: 'my-release-key.jks'
            def ksPassword = System.getenv('KEYSTORE_PASSWORD') ?: '123456'
            def keyAliasName = System.getenv('KEY_ALIAS') ?: 'my-key-alias'
            def keyPwd = System.getenv('KEY_PASSWORD') ?: '123456'
            
            storeFile file(ksFile)
            storePassword ksPassword
            keyAlias keyAliasName
            keyPassword keyPwd
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildToolsVersion '34.0.0'

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def baseName = "文档密码管理_${variant.versionName}_${buildDate}"
            output.outputFileName = "${baseName}.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.10.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}